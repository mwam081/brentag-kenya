<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Queries - Admin Panel - Brentag Kenya Ltd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css?v=7.0">
    <style>
        .admin-sidebar {
            background: #2c3e50;
            min-height: 100vh;
            padding: 0;
        }
        .admin-sidebar .nav-link {
            color: #ecf0f1;
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
            transition: all 0.3s;
        }
        .admin-sidebar .nav-link:hover {
            background: #34495e;
            color: #3498db;
        }
        .admin-sidebar .nav-link.active {
            background: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 admin-sidebar">
                <div class="text-center py-4">
                    <h4 class="text-white">Admin Panel</h4>
                    <p class="text-muted small">Brentag Kenya Ltd</p>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link text-white" href="admin.html">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                    <a class="nav-link text-white active" href="queries.html">
                        <i class="fas fa-envelope me-2"></i>Contact Queries
                    </a>
                    <a class="nav-link text-white" href="index.html" target="_blank">
                        <i class="fas fa-eye me-2"></i>View Site
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10">
                <div class="container-fluid py-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="fas fa-envelope me-2"></i>Contact Queries</h2>
                        <a href="admin.html" class="btn btn-primary">
                            <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                        </a>
                    </div>

                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        This is a static demo. Contact queries functionality requires the Flask backend.
                    </div>

                    <div class="text-center py-5">
                        <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                        <h4 class="text-muted">No Contact Queries Yet</h4>
                        <p class="text-muted">Contact form submissions will appear here in the live version with backend support.</p>
                        <button class="btn btn-primary mt-3" onclick="showDemoAlert()">
                            View Demo Query
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showDemoAlert() {
            alert('This is a demo. In the live version with backend support, contact form submissions would appear here with full management functionality.');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
